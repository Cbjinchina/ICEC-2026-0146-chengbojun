<text x="24.0" y="34.0" font-size="19" fill="#212529" text-anchor="start" font-weight="700">图 2　窗侧晾衣杆 · 衣物与窗面干涉（现状 / 改造）</text>
<text x="24.0" y="56.0" font-size="11.5" fill="#868e96" text-anchor="start" font-weight="400">侧视示意，单位 cm　｜　杆件离地约 3 m，须借助撑衣杆操作　｜　实测：挂衣后衣物侧缘与窗框接触</text>
<text x="36.0" y="96.0" font-size="15" fill="#212529" text-anchor="start" font-weight="700">现状：衣物贴窗、蹭灰蹭水</text><line x1="24.0" y1="452.0" x2="476.0" y2="452.0" stroke="#343a40" stroke-width="2"/><line x1="24.0" y1="118.0" x2="476.0" y2="118.0" stroke="#dee2e6" stroke-width="1.2" stroke-dasharray="6 4"/><text x="28.0" y="110.0" font-size="10.5" fill="#868e96" text-anchor="start" font-weight="400">顶面（杆件贴近天棚）</text><rect x="336.0" y="118.0" width="12.0" height="334.0" rx="0" fill="#e7f5ff" stroke="#343a40" stroke-width="1.4"/><text x="356.0" y="444.0" font-size="10.5" fill="#868e96" text-anchor="start" font-weight="400">窗 / 推拉门</text><circle cx="320.0" cy="152" r="7.5" fill="#ced4da" stroke="#343a40" stroke-width="1.6"/><text x="307.0" y="144.0" font-size="10.5" fill="#495057" text-anchor="end" font-weight="400">晾衣杆 Ø2.5</text><path d="M 320.0 160 L 309.0 184 L 331.0 184" fill="none" stroke="#495057" stroke-width="1.6"/><line x1="307.0" y1="184.0" x2="333.0" y2="184.0" stroke="#495057" stroke-width="1.6"/><path d="M 304.0 186 L 311.0 336 L 329.0 336 L 336.0 186 Z" fill="#f8f9fa" stroke="#495057" stroke-width="1.5"/><text x="320.0" y="262.0" font-size="13" fill="#868e96" text-anchor="middle" font-weight="400">衣</text><line x1="333.0" y1="190.0" x2="333.0" y2="330.0" stroke="#c92a2a" stroke-width="2.6" stroke-dasharray="5 3"/><text x="356.0" y="206.0" font-size="11.5" fill="#c92a2a" text-anchor="start" font-weight="700">衣物侧缘与窗框接触</text><text x="356.0" y="226.0" font-size="12.5" fill="#c92a2a" text-anchor="start" font-weight="700">实测间隙 ≈ 0</text><text x="36.0" y="500.0" font-size="11.5" fill="#868e96" text-anchor="start" font-weight="400">杆件距窗框不足一衣之厚，挂衣即接触玻璃与窗框。</text>
<line x1="512.0" y1="80.0" x2="512.0" y2="520.0" stroke="#dee2e6" stroke-width="1" stroke-dasharray="5 5"/>
<text x="548.0" y="96.0" font-size="15" fill="#212529" text-anchor="start" font-weight="700">改造后：杆件平行外移 10 cm</text><line x1="536.0" y1="452.0" x2="988.0" y2="452.0" stroke="#343a40" stroke-width="2"/><line x1="536.0" y1="118.0" x2="988.0" y2="118.0" stroke="#dee2e6" stroke-width="1.2" stroke-dasharray="6 4"/><text x="540.0" y="110.0" font-size="10.5" fill="#868e96" text-anchor="start" font-weight="400">顶面（杆件贴近天棚）</text><rect x="848.0" y="118.0" width="12.0" height="334.0" rx="0" fill="#e7f5ff" stroke="#343a40" stroke-width="1.4"/><text x="868.0" y="444.0" font-size="10.5" fill="#868e96" text-anchor="start" font-weight="400">窗 / 推拉门</text><circle cx="792.0" cy="152" r="7.5" fill="#ced4da" stroke="#343a40" stroke-width="1.6"/><text x="779.0" y="144.0" font-size="10.5" fill="#495057" text-anchor="end" font-weight="400">晾衣杆 Ø2.5</text><path d="M 792.0 160 L 781.0 184 L 803.0 184" fill="none" stroke="#495057" stroke-width="1.6"/><line x1="779.0" y1="184.0" x2="805.0" y2="184.0" stroke="#495057" stroke-width="1.6"/><path d="M 776.0 186 L 783.0 336 L 801.0 336 L 808.0 186 Z" fill="#f8f9fa" stroke="#495057" stroke-width="1.5"/><text x="792.0" y="262.0" font-size="13" fill="#868e96" text-anchor="middle" font-weight="400">衣</text><line x1="812.0" y1="352.0" x2="848.0" y2="352.0" stroke="#2f9e44" stroke-width="1.15"/><line x1="812.0" y1="347.0" x2="812.0" y2="357.0" stroke="#2f9e44" stroke-width="1.15"/><line x1="848.0" y1="347.0" x2="848.0" y2="357.0" stroke="#2f9e44" stroke-width="1.15"/><polygon points="812.0,352.0 816.6,350.0 816.6,354.0" fill="#2f9e44"/><polygon points="848.0,352.0 843.4,354.0 843.4,350.0" fill="#2f9e44"/><text x="830.0" y="368.0" font-size="12" fill="#2f9e44" text-anchor="middle" font-weight="600">净空 10</text><text x="868.0" y="292.0" font-size="11.5" fill="#2f9e44" text-anchor="start" font-weight="700">衣物不再贴窗</text><text x="548.0" y="500.0" font-size="11.5" fill="#868e96" text-anchor="start" font-weight="400">加长角码支架，杆件整体外移，原孔位不变。</text>
