出深度未实测</text><line x1="190.0" y1="470.0" x2="366.0" y2="470.0" stroke="#1c7ed6" stroke-width="1.15"/><line x1="190.0" y1="465.0" x2="190.0" y2="475.0" stroke="#1c7ed6" stroke-width="1.15"/><line x1="366.0" y1="465.0" x2="366.0" y2="475.0" stroke="#1c7ed6" stroke-width="1.15"/><polygon points="190.0,470.0 194.6,468.0 194.6,472.0" fill="#1c7ed6"/><polygon points="366.0,470.0 361.4,472.0 361.4,468.0" fill="#1c7ed6"/><text x="278.0" y="463.0" font-size="12" fill="#1c7ed6" text-anchor="middle" font-weight="600">门洞净宽 80</text><text x="36.0" y="516.0" font-size="11.5" fill="#495057" text-anchor="start" font-weight="400">门扇开启 + 箱体凸出共用同一断面，</text><text x="36.0" y="536.0" font-size="11.5" fill="#495057" text-anchor="start" font-weight="400">搬运大件时需侧身通过。</text>
<line x1="512.0" y1="80.0" x2="512.0" y2="520.0" stroke="#dee2e6" stroke-width="1" stroke-dasharray="5 5"/>
<text x="548.0" y="92.0" font-size="14.5" fill="#212529" text-anchor="start" font-weight="700">改造后：箱体嵌入，断面恢复</text><text x="548.0" y="112.0" font-size="11" fill="#868e96" text-anchor="start" font-weight="400">地面加警示带，预算 60~90 元</text><rect x="548.0" y="116.0" width="464.0" height="74.0" rx="0" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/><text x="780.0" y="150.0" font-size="11.5" fill="#adb5bd" text-anchor="middle" font-weight="600">走 廊（门外侧）</text><text x="848.0" y="438.8" font-size="11.5" fill="#adb5bd" text-anchor="middle" font-weight="600">室内</text><rect x="548.0" y="190.0" width="154.0" height="52.8" rx="0" fill="#f1f3f5" stroke="#343a40" stroke-width="1.8"/><rect x="878.0" y="190.0" width="134.0" height="52.8" rx="0" fill="#f1f3f5" stroke="#343a40" stroke-width="1.8"/><line x1="702.0" y1="190.0" x2="702.0" y2="242.8" stroke="#343a40" stroke-width="2.4"/><line x1="878.0" y1="190.0" x2="878.0" y2="242.8" stroke="#343a40" stroke-width="2.4"/><rect x="697.0" y="239.8" width="5.0" height="176.0" rx="0" fill="#dee2e6" stroke="#343a40" stroke-width="1.4"/><polyline points="878.0,242.8 877.9,249.7 877.5,256.6 876.8,263.5 875.8,270.3 874.6,277.1 873.1,283.9 871.4,290.6 869.4,297.2 867.1,303.7 864.6,310.2 861.8,316.5 858.8,322.7 855.6,328.8 852.1,334.8 848.3,340.6 844.4,346.3 840.2,351.8 835.8,357.1 831.2,362.3 826.5,367.3 821.5,372.0 816.3,376.6 811.0,381.0 805.5,385.2 799.8,389.1 794.0,392.9 788.0,396.4 781.9,399.6 775.7,402.6 769.4,405.4 762.9,407.9 756.4,410.2 749.8,412.2 743.1,413.9 736.3,415.4 729.5,416.6 722.7,417.6 715.8,418.3 708.9,418.7 702.0,418.8" fill="none" stroke="#adb5bd" stroke-width="1.1" stroke-dasharray="5 4"/><rect x="900.0" y="194.0" width="72.0" height="44.8" rx="0" fill="#e9ecef" stroke="#2f9e44" stroke-width="1.5"/><text x="936.0" y="150.0" font-size="11.5" fill="#2f9e44" text-anchor="middle" font-weight="700">嵌入式箱体</text><text x="936.0" y="166.0" font-size="10" fill="#2f9e44" text-anchor="middle" font-weight="400">与墙面齐平，不占断面</text><rect x="702.0" y="242.8" width="176.0" height="99.0" rx="2" fill="#ffe8e8" stroke="#c92a2a" stroke-width="1.2"/><text x="790.0" y="298.8" font-size="11" fill="#c92a2a" text-anchor="middle" font-weight="700">地面 45 cm 警示标识带</text><line x1="702.0" y1="470.0" x2="878.0" y2="470.0" stroke="#1c7ed6" stroke-width="1.15"/><line x1="702.0" y1="465.0" x2="702.0" y2="475.0" stroke="#1c7ed6" stroke-width="1.15"/><line x1="878.0" y1="465.0" x2="878.0" y2="475.0" stroke="#1c7ed6" stroke-width="1.15"/><polygon points="702.0,470.0 706.6,468.0 706.6,472.0" fill="#1c7ed6"/><polygon points="878.0,470.0 873.4,472.0 873.4,468.0" fill="#1c7ed6"/><text x="790.0" y="463.0" font-size="12" fill="#1c7ed6" text-anchor="middle" font-weight="600">净通行断面 80</text><text x="548.0" y="516.0" font-size="11.5" fill="#495057" text-anchor="start" font-weight="400">箱体不再向走廊凸出；</text><text x="548.0" y="536.0" font-size="11.5" fill="#495057" text-anchor="start" font-weight="400">警示带提示门扇开启范围，避免站人。</text>
<text x="24.0" y="566.0" font-size="11.5" fill="#868e96" text-anchor="start" font-weight="400">改造清单：凸出式消防箱改为嵌入式或薄型壁挂（厚度 ≤12 cm）　+　门侧地面 45 cm 警示标识带</text>
<text x="24.0" y="588.0" font-size="11.5" fill="#868e96" text-anchor="start" font-weight="400">说明：门洞净宽 80 cm 本身不违规，缺陷在于与箱体、门扇叠加后的通行余量；因此本条判定为「临界型」，不对门洞宽度提整改要求。</text>
</svg>