<text x="24.0" y="34.0" font-size="19" fill="#212529" text-anchor="start" font-weight="700">图 3　宿舍门 · 通行断面实测与改造（平面）</text>
<text x="24.0" y="56.0" font-size="11.5" fill="#868e96" text-anchor="start" font-weight="400">单位 cm　｜　俯视平面示意　｜　图中仅「门洞净宽 80」为本次实测，箱体位置与墙厚为示意，突出深度未实测，故不对通行净宽作定量结论</text>
